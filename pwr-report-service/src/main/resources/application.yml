spring:
  application:
    name: pwr-report-service
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 128MB
      max-request-size: 128MB
  datasource:
      username: ${DB_USER}
      password: ${DB_PASS}
      url: ${DB_URL}
      driver-class-name: ${DB_DRIVER_CLASS_NAME}
  jpa:
      hibernate:
        ddl-auto: ${DB_HIBERNATE_DDL_AUTO:none}
  main:
    allow-bean-definition-overriding: true
server:
  port: 9005
management:
  endpoints:
    web:
      cors:
        allowed-origins: '*'
        allowed-methods: '*'
pwr-profile-service-url: http://pwr-profile-service:9004
pwr-view-profile-service-url: http://pwr-view-profile-service:9008
pwr:
  housekeeping:
    # Documents older than this the housekeeping offers to delete (#289); the newest of each consultant always stays
    old-reports-after: 730d
---
spring:
  profiles: localDev
  datasource:
    username: root
    password: changeit
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mysql://localhost:3307/report
  jpa:
    hibernate:
      ddl-auto: update
pwr-profile-service-url: http://localhost:9004
pwr-view-profile-service-url: http://localhost:9008
