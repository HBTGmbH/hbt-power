name: pwr-skill-service

on:
  push:
    branches:
      - main
    paths:
      - 'pwr-skill-service/**'
      - '!pwr-skill-service/local-dev/**'
      - '!pwr-skill-service/**/*.md'
      - '!pwr-skill-service/**/*.MD'
      - '.github/workflows/pwr-skill-service.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hbtgmbh/hbt-power/pwr-skill-service

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwr-skill-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 13
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '13'
          cache: maven
          cache-dependency-path: pwr-skill-service/pom.xml

      - name: Build and test with Maven
        run: mvn -B package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: pwr-skill-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
