name: pwr-profile-service

on:
  push:
    branches:
      - main
    paths: &paths
      - 'pwr-profile-service/**'
      - '!pwr-profile-service/local-dev/**'
      - '!pwr-profile-service/**/*.md'
      - '.github/workflows/pwr-profile-service.yml'
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs stop; runs on main queue, so every commit there gets its image
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/hbtgmbh/hbt-power/pwr-profile-service

defaults:
  run:
    shell: bash
    working-directory: pwr-profile-service

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 13
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '13'
          cache: maven
          cache-dependency-path: pwr-profile-service/pom.xml

      - name: Build and test with Maven
        run: mvn -B package

      # Only checks that the image builds; images are published from main
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: pwr-profile-service
          push: false

  publish:
    name: Build, test and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # pushes the image to ghcr.io
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No Maven cache in the publishing job, so no cached dependency can end up in the image
      - name: Set up JDK 13
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '13'

      - name: Build and test with Maven
        run: mvn -B package
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: pwr-profile-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
