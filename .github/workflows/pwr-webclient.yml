name: pwr-webclient

on:
  push:
    branches:
      - main
    paths:
      - 'pwr-webclient/**'
      - '!pwr-webclient/**/*.md'
      - '.github/workflows/pwr-webclient.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hbtgmbh/hbt-power/pwr-webclient

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwr-webclient
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwr-webclient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # After the build: react-scripts build empties the build folder
      - name: Write build info
        run: npm run compileInfo
        env:
          BUILD_TAG: ${{ github.workflow }}-${{ github.run_number }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: pwr-webclient
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
