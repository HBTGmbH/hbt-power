server:
  port: 9000
pwr:
  url:
    skill: http://pwr-skill-service:9003
    profile: http://pwr-profile-service:9004
    report: http://pwr-report-service:9005
    view-profile: http://pwr-view-profile-service:9008
    statistics: http://pwr-statistics-service:9007
management:
  endpoints:
    web:
      # Like the services behind the edge, so the webclient reaches it as /api/pwr-edge-service/actuator/info
      base-path: /pwr-edge-service/actuator
      exposure:
        include: health,info
spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB
  cloud:
    gateway:
      httpclient:
        # A service that hangs must not hold the edge (#249); longer than the slow calls of the services (60 s)
        connect-timeout: 2000
        response-timeout: 90s
---
spring:
  config:
    activate:
      on-profile: localDev
pwr:
  url:
    skill: http://localhost:9003
    profile: http://localhost:9004
    report: http://localhost:9005
    view-profile: http://localhost:9008
    statistics: http://localhost:9007
logging:
  level:
    org:
      springframework:
        security: trace
