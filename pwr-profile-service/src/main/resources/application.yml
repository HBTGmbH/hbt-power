spring:
    application:
      name: pwr-profile-service
    jackson:
      serialization:
        write_dates_as_timestamps: false
    datasource:
      username: ${DB_USER}
      password: ${DB_PASS}
      url: ${DB_URL}
      driver-class-name: ${DB_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}
    jpa:
      hibernate:
        ddl-auto: ${DB_HIBERNATE_DDL_AUTO:none}
    servlet:
      multipart:
        max-file-size: 32MB
        max-request-size: 32MB
server:
    port: 9004
logging:
  level:
    ROOT: info
    de.hbt.pwr: debug
    org.springframework.web: debug
  file: profile-service.log
# This service can be polite!
isPolite: true
default-chars-per-line: 32
# The default is a docker-compose deployment; use hostnames
pwr-skill-service-url: http://pwr-skill-service:9003
# The default is a docker-compose deployment; use hostnames
pwr-view-profile-service-url: http://pwr-view-profile-service:9008
# Profile check (#139): what counts as missing or outdated (ProfileCheckProperties)
profile-check:
  # Sections that need at least one entry: LANGUAGES, QUALIFICATIONS, TRAININGS, EDUCATION, SECTORS, CAREER,
  # SPECIAL_FIELDS, SKILLS, PROJECTS
  required-sections: LANGUAGES, EDUCATION, CAREER, TRAININGS, SECTORS, SKILLS, PROJECTS
  min-description-length: 500
  min-project-skills: 5
  min-project-description-length: 500
  projects-max-age-months: 12
  running-project-max-age-months: 12
  follow-up-project-months: 3
  skills-max-age-months: 6
---
# Use this with the root docker-compose.yaml
spring:
  profiles: localDev
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: changeit
    url: jdbc:mysql://localhost:3307/profile
  jpa:
    hibernate:
      ddl-auto: update
      use-new-id-generator-mappings: false
pwr-skill-service-url: http://localhost:9003
pwr-view-profile-service-url: http://localhost:9008
logging:
  # Console only; don't write profile-service.log locally
  file: ''
  level:
    org.springframework.web: DEBUG
