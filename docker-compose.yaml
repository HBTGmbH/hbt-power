# Infrastructure dependencies for running the pwr-* services locally.
# Settings match the services' localDev Spring profiles.
services:
  # Used by pwr-skill-service, pwr-profile-service and pwr-report-service
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    networks:
      - hbt-power
    # Published on 3307 so it can run next to another local MySQL/MariaDB on 3306.
    # Inside the hbt-power network it stays mariadb:3306.
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: changeit
      TZ: Europe/Berlin
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro

  # Used by pwr-view-profile-service and pwr-statistics-service
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - hbt-power
    command: redis-server --requirepass changeit
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

networks:
  hbt-power:
    name: hbt-power

volumes:
  mariadb-data: {}
  redis-data: {}
