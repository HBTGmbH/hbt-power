server {
    listen       80;
    server_name  localhost;

    client_max_body_size 50M;

    root /usr/share/nginx/html;

    # index.html (also as fallback for client routes): revalidate on every load,
    # otherwise a cached index.html references bundles that no longer exist after an update
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Bundles with a content hash in their name never change
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Files without a hash in their name: revalidate, and no index.html for missing files
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /iso_639-2.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(css|img|localization)/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
