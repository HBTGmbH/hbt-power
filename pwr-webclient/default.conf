server {
    listen       80;
    server_name  localhost;

    client_max_body_size 50M;

    root /usr/share/nginx/html;

    # Everything outside /static/ has no content hash in its name (index.html, config.js, build_info.json,
    # favicon.png): revalidate on every load, otherwise a cached index.html references bundles that no
    # longer exist after an update. Inherited by every location that sets no add_header itself.
    add_header Cache-Control "no-cache";

    # Client routes get index.html
    location / {
        try_files $uri /index.html;
    }

    # Requests for a file never fall back to index.html, so a missing file is a 404 and not HTML
    location ~ \.\w+$ {
        try_files $uri =404;
    }

    # Bundles with a content hash in their name never change
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
